<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Deteksi Pemilah Sampah</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #eee;
        font-family: "Segoe UI", Arial, sans-serif;
        height: 100%;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
      }
      #stage {
        position: relative;
      }
      canvas {
        border-radius: 8px;
        background: #000;
      }
      #status {
        margin-top: 10px;
        font-size: 14px;
        color: #aaa;
      }
      #startBtn {
        margin-top: 14px;
        padding: 10px 22px;
        font-size: 15px;
        border: none;
        border-radius: 6px;
        background: #2d7;
        color: #06210f;
        cursor: pointer;
        font-weight: 600;
      }
      #startBtn:disabled {
        background: #555;
        color: #ccc;
        cursor: default;
      }
      video {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <h2>Deteksi Pemilah Sampah</h2>
      <div id="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
      </div>
      <button id="startBtn" disabled>Memuat...</button>
      <button
        id="recalibrateBtn"
        style="
          display: none;
          margin-top: 8px;
          padding: 6px 16px;
          font-size: 13px;
          border: none;
          border-radius: 6px;
          background: #444;
          color: #eee;
          cursor: pointer;
        "
      >
        Kalibrasi Ulang Latar Belakang
      </button>
      <div id="status">Menunggu izin kamera...</div>
    </div>

    <!-- TensorFlow.js (dibutuhkan untuk memuat model.json hasil export Teachable Machine) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>

    <!-- Logika aplikasi -->
    <script src="script.js"></script>
  </body>
</html>
