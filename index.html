<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deteksi Pemilah Sampah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="m-0 p-0 bg-[#111] text-[#eee] font-['Segoe_UI',Arial,sans-serif] h-screen">
    <div id="wrap" class="flex flex-col items-center p-4">
      <h2 class="text-2xl font-bold mb-4">Deteksi Pemilah Sampah</h2>

      <div id="stage" class="relative">
        <video id="video" autoplay playsinline muted class="hidden"></video>
        <canvas id="output" class="rounded-lg bg-black"></canvas>
      </div>

      <button
        id="startBtn"
        disabled
        class="mt-3.5 px-[22px] py-2.5 text-[15px] border-none rounded-md bg-[#2d7] text-[#06210f] cursor-pointer font-semibold disabled:bg-[#555] disabled:text-[#ccc] disabled:cursor-default">
        Memuat...
      </button>

      <button
        id="recalibrateBtn"
        class="hidden mt-2 px-4 py-1.5 text-[13px] border-none rounded-md bg-[#444] text-[#eee] cursor-pointer">
        Kalibrasi Ulang Latar Belakang
      </button>

      <div id="status" class="mt-2.5 text-sm text-[#aaa]">
        Menunggu izin kamera...
      </div>
    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <!-- Logika aplikasi -->
    <script src="script.js"></script>
  </body>
</html>
